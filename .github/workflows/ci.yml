name: CI and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: configcenter-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: configcenter
        ports:
          - 23306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned common infrastructure
        env:
          COMMON_REPO_TOKEN: ${{ secrets.COMMON_REPO_TOKEN }}
          COMMON_REPO_SSH_KEY: ${{ secrets.COMMON_REPO_SSH_KEY }}
        run: node tools/common.ts --locked
      - uses: ./.tmp/common/.github/actions/check

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.SCF_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      STAGE: production
      SERVERLESS_PLATFORM_VENDOR: tencent
      SCF_REGION: ${{ vars.SCF_REGION }}
      SCF_VPC_ID: ${{ vars.SCF_VPC_ID }}
      SCF_SUBNET_ID: ${{ vars.SCF_SUBNET_ID }}
      TMPDIR: ${{ github.workspace }}/.tmp
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p .tmp
      - name: Fetch pinned common infrastructure
        env:
          COMMON_REPO_TOKEN: ${{ secrets.COMMON_REPO_TOKEN }}
          COMMON_REPO_SSH_KEY: ${{ secrets.COMMON_REPO_SSH_KEY }}
        run: node tools/common.ts --locked
      - uses: ./.tmp/common/.github/actions/setup
      - name: Build Linux deployment package
        run: |
          mkdir -p .tmp/scf
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 make build BIN=.tmp/scf/configcenter
          cp scf_bootstrap .tmp/scf/scf_bootstrap
          chmod +x .tmp/scf/scf_bootstrap
      - name: Prepare runtime configuration
        env:
          RUNTIME_ENV: ${{ secrets.SCF_RUNTIME_ENV }}
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: |
          test -n "$TENCENT_SECRET_ID"
          test -n "$TENCENT_SECRET_KEY"
          test -n "$SCF_REGION"
          test -n "$SCF_VPC_ID"
          test -n "$SCF_SUBNET_ID"
          test -n "$RUNTIME_ENV"
          umask 077
          printf '%s\n' "$RUNTIME_ENV" > .tmp/scf/.env.local
      - name: Deploy Tencent SCF
        uses: woodyyan/tencent-serverless-action@56a4f1cf4ccd306834307c882a893ceb2c7e49e1
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure fixed intranet egress IP
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: |
          python -m venv .tmp/scf-venv
          .tmp/scf-venv/bin/pip install tencentcloud-sdk-python-scf==3.1.100
          .tmp/scf-venv/bin/python tools/scf-network.py configcenter
      - name: Remove runtime configuration
        if: always()
        run: rm -f .tmp/scf/.env.local
